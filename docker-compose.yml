services:
  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: cinebook-auth
    ports:
      - "9898:9898"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DB: ${MYSQL_AUTH_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      EMAIL: ${EMAIL}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS}
    env_file:
      - .env
    networks:
      - cinebook

  booking-service:
    build:
      context: ./BookingService
      dockerfile: Dockerfile
    container_name: cinebook-booking
    ports:
      - "9830:9830"
    environment:
      MONGO_URL: ${MONGO_URL}
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
    env_file:
      - .env
    networks:
      - cinebook

  movie-service:
    build:
      context: ./MovieService
      dockerfile: Dockerfile
    container_name: cinebook-movie
    ports:
      - "9820:9820"
    environment:
      MONGO_URL: ${MONGO_URL}
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_S3_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    env_file:
      - .env
    networks:
      - cinebook

  user-service:
    build:
      context: ./UserService
      dockerfile: Dockerfile
    container_name: cinebook-user
    ports:
      - "9810:9810"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DB: ${MYSQL_USER_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_PORT: ${KAFKA_PORT}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    env_file:
      - .env
    networks:
      - cinebook

  ui:
    build:
      context: ./UI
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      dockerfile: Dockerfile
    container_name: cinebook-ui
    ports:
      - "80:80"
    env_file:
      - UI/.env
    networks:
      - cinebook

  kong:
    build:
      context: ./Kong
      dockerfile: Dockerfile
    container_name: cinebook-kong
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    networks:
      - cinebook

networks:
  cinebook:
    driver: bridge
