spring.application.name=userservice
spring.kafka.bootstrap-servers=${KAFKA_HOST:gondola.proxy.rlwy.net}:${KAFKA_PORT:27480}
spring.kafka.consumer.group-id=userinfo-consumer-group
spring.kafka.consumer.key-deserializer= org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer= userservice.cinebook.deserializer.UserInfoDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.topic-json.name=user_service
spring.kafka.consumer.properties.spring.json.type.mapping=auth:userservice.cinebook.entities.UserInfoDto

spring.datasource.driver=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:UserService}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:USER}
spring.datasource.password=${MYSQL_PASSWORD:PASSWORD}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=update
server.port=9810

aws.region=${AWS_DEFAULT_REGION:ap-south-1}
aws.access-key=${AWS_ACCESS_KEY_ID:REPLACE_WITH_AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:REPLACE_WITH_AWS_SECRET_ACCESS_KEY}
aws.s3.bucket=${AWS_S3_BUCKET_NAME:cinebook-object-storage}

logging.level.org.springframework.security=DEBUG